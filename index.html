
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AR Photo</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin:0; width:100%; height:100%; overflow:hidden; font-family:sans-serif; }
#ar-container { position:fixed; inset:0; overflow:hidden; background:transparent; }
#ar-container video { position:absolute!important; z-index:0!important; background:transparent!important; }
#ar-container .a-canvas { position:absolute!important; z-index:2!important; background:transparent!important; }
a-scene, .a-canvas { background:transparent!important; }
#compositeCanvas {
  display:none; position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; z-index:1; pointer-events:none;
}
#guide {
  position:fixed; top:14px; left:50%; transform:translateX(-50%);
  z-index:20; max-width:94%; padding:9px 15px;
  border-radius:25px; background:rgba(255,255,255,.93);
  color:#333; font-size:13px; text-align:center; pointer-events:none;
}
#controls {
  position:fixed; z-index:30; left:50%; transform:translateX(-50%);
  bottom:calc(80px + env(safe-area-inset-bottom, 0px));
  width:94%; max-width:520px; max-height:56dvh; overflow-y:auto;
  background:rgba(255,255,255,.96); padding:14px; border-radius:16px;
  box-shadow:0 3px 20px rgba(0,0,0,.18);
}
#controls.hidden { display:none; }
.section-title { font-size:13px; font-weight:700; margin:3px 0 8px; }
.choices { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; }
.background-choices { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-bottom:12px; }
.option {
  display:flex; align-items:center; justify-content:center; gap:5px;
  min-height:43px; padding:9px 4px; border:1px solid #ccd5da;
  border-radius:10px; background:white; color:#333; text-align:center;
  font-size:12px; cursor:pointer;
}
.option:has(input:checked) { background:#dceff5; border:2px solid #58a6bc; font-weight:700; }
.option input { flex-shrink:0; margin:0; accent-color:#32809b; }
button { border:1px solid #ccc; border-radius:10px; background:#fff; color:#333; padding:12px 8px; font-size:14px; cursor:pointer; }
#clearSelection { border:0; background:none; padding:2px 4px; font-size:12px; color:#27627a; }
#doneSettings { width:100%; margin-top:12px; background:#dceff5; border-color:#58a6bc; font-weight:700; }
#status { margin-top:8px; text-align:center; color:#555; font-size:11px; }
#actionBar {
  position:fixed; z-index:35; left:50%; transform:translateX(-50%);
  bottom:calc(10px + env(safe-area-inset-bottom, 0px));
  width:94%; max-width:520px; display:flex; gap:8px;
}
#settingsToggle { flex:0 0 95px; background:rgba(255,255,255,.95); }
#capture { flex:1; background:#333; color:#fff; font-size:16px; }
#capture:disabled { opacity:.6; }
#preview {
  display:none; position:fixed; z-index:100; inset:0;
  background:rgba(0,0,0,.95); padding:15px;
  flex-direction:column; align-items:center; justify-content:center; gap:12px;
}
#photo { max-width:100%; max-height:72vh; object-fit:contain; }
.previewButtons { display:flex; width:100%; max-width:400px; gap:10px; }
.previewButtons button { flex:1; }
@media(max-width:370px) { .choices { grid-template-columns:repeat(3,minmax(0,1fr)); } }
</style>
<script>
/* GLBにアニメーションがある場合だけ再生。マーカーの揺れを付け足さない。 */
AFRAME.registerComponent("play-glb-animation", {
  init() {
    this.mixer = null;
    this.onLoaded = event => {
      if (event.target !== this.el) return;
      const model = event.detail.model;
      const clips = model && model.animations;
      if (!clips || !clips.length) return;
      if (this.mixer) this.mixer.stopAllAction();
      this.mixer = new AFRAME.THREE.AnimationMixer(model);
      this.mixer.clipAction(clips[0]).setLoop(AFRAME.THREE.LoopRepeat, Infinity).play();
    };
    this.el.addEventListener("model-loaded", this.onLoaded);
  },
  tick(time, delta) {
    if (this.mixer && this.el.object3D.visible) {
      this.mixer.update(Math.min(delta / 1000, .1));
    }
  },
  remove() {
    this.el.removeEventListener("model-loaded", this.onLoaded);
    if (this.mixer) this.mixer.stopAllAction();
  }
});
</script>
</head>
<body>
<div id="ar-container">
  <canvas id="compositeCanvas"></canvas>
  <a-scene id="scene"
    mindar-image="
      imageTargetSrc: ./assets/ume-marker.mind;
      autoStart: true;
      uiLoading: yes;
      uiScanning: no;
      filterMinCF: 0.0001;
      filterBeta: 0.001;
      missTolerance: 10;
    "
    embedded
    renderer="colorManagement: true; physicallyCorrectLights: true; preserveDrawingBuffer: true; alpha: true;"
    background="color: #000000; transparent: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="target" mindar-image-target="targetIndex: 0"></a-entity>
  </a-scene>
</div>

<div id="guide">カメラを準備しています</div>

<div id="controls">
  <div class="section-title">背景</div>
  <div class="background-choices">
    <label class="option"><input type="radio" name="background" value="none" checked>カメラそのまま</label>
    <label class="option"><input type="radio" name="background" value="university">大学の背景</label>
  </div>
  <div class="section-title" style="display:flex;justify-content:space-between;align-items:center">
    <span>キャラクター（複数選択できます）</span>
    <button type="button" id="clearSelection">すべて解除</button>
  </div>
  <div id="characterChoices" class="choices"></div>
  <button type="button" id="doneSettings">設定完了・撮影へ</button>
  <div id="status" role="status">ARを起動しています</div>
</div>

<div id="actionBar">
  <button type="button" id="settingsToggle">設定を閉じる</button>
  <button type="button" id="capture">写真を撮る</button>
</div>

<div id="preview">
  <img id="photo" alt="AR写真">
  <div class="previewButtons">
    <button type="button" id="savePhoto">保存・共有</button>
    <button type="button" id="closePreview">ARに戻る</button>
  </div>
</div>

<script>
const scene = document.getElementById("scene");
const footerText = "Tsuda University 2026.10.18";
const target = document.getElementById("target");
const guide = document.getElementById("guide");
const controls = document.getElementById("controls");
const statusText = document.getElementById("status");
const compositeCanvas = document.getElementById("compositeCanvas");
const compositeContext = compositeCanvas.getContext("2d");
const personCanvas = document.createElement("canvas");
const personContext = personCanvas.getContext("2d");
const SEGMENTATION_CDN = "https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1";

/* bear-run / bear-dance の中身は「トラ」。ファイル名はそのまま使う。 */
const characters = [
  {id:"umeko",       name:"津田梅子",   file:"umeko.glb",        baseScale:1.5},
  {id:"zundamon",    name:"ずんだもん", file:"zundamon.glb",     baseScale:1.5},
  {id:"dino",        name:"恐竜",       file:"T_Rex.glb",        baseScale:1.0},
  {id:"bearRun",     name:"走るトラ",   file:"bear-run.glb",     baseScale:1.5, size:0.6, animate:true},
  {id:"bearDance",   name:"踊るトラ",   file:"bear-dance.glb",   baseScale:1.5, size:0.6, animate:true},
  {id:"rabbitDance", name:"踊るうさぎ", file:"rabbit-dance.glb", baseScale:1.5, size:0.6, animate:true},
  {id:"rabbitRun",   name:"走るうさぎ", file:"rabbit-run.glb",   baseScale:1.5, size: 0.6, animate:true},
  {id:"tako",        name:"タコ",       file:"tako.glb",         baseScale:1.5, size: 0.6, animate:true}
];

const selected = new Set(["umeko"]);
const loaded = new Set();
const slots = {};
const models = {};
let markerFound = false;
let backgroundMode = "none";
let universityImage = null;
let universityPromise = null;
let segmentation = null;
let segmentationPromise = null;
let segmentationBusy = false;
let compositeReady = false;
let backgroundLoopRunning = false;
let lastSegmentationTime = 0;
let segmentationFailures = 0;
let photoBlob = null;
let photoURL = null;

function setStatus(message) { statusText.textContent = message; }

/* キャラクター選択ボタンと3Dの表示領域を作る */
const choices = document.getElementById("characterChoices");
characters.forEach(c => {
  const label = document.createElement("label");
  label.className = "option";
  const input = document.createElement("input");
  input.type = "checkbox";
  input.checked = selected.has(c.id);
  input.addEventListener("change", () => {
    if (input.checked) selected.add(c.id);
    else selected.delete(c.id);
    arrangeCharacters();
    setStatus("選択中：" + selected.size + "体");
  });
  label.append(input, document.createTextNode(c.name));
  choices.appendChild(label);

  const slot = document.createElement("a-entity");
  slot.setAttribute("visible", "false");
  slot.setAttribute("id", "slot-" + c.id);
  const model = document.createElement("a-gltf-model");
  model.setAttribute("id", "model-" + c.id);
  model.setAttribute("position", "0 0 0");
  model.setAttribute("rotation", "90 0 0");
  if (c.animate) model.setAttribute("play-glb-animation", "");
  slot.appendChild(model);
  target.appendChild(slot);
  slots[c.id] = slot;
  models[c.id] = model;
});

function loadCharacter(c) {
  if (loaded.has(c.id)) return;
  loaded.add(c.id);
  const model = models[c.id];
  model.addEventListener("model-error", () => {
    loaded.delete(c.id);
    setStatus(c.name + "の読み込みに失敗：assets/" + c.file);
    guide.textContent = c.name + "を読み込めませんでした";
  });
  model.setAttribute("gltf-model", "./assets/" + c.file);
}

/* 複数選択した3Dモデルを重なりにくい位置に配置 */
function arrangeCharacters() {
  const active = characters.filter(c => selected.has(c.id));
  const count = active.length;
  const twoRows = count > 4;
  const spacing = count === 2 ? .75 : count === 3 ? .60 : .50;
  const groupScale = count <= 1 ? 1 : count === 2 ? .63 :
                     count === 3 ? .49 : count === 4 ? .41 : .35;

  characters.forEach(c => slots[c.id].setAttribute("visible", selected.has(c.id)));
  active.forEach((c, i) => {
    const row = Math.floor(i / 4);
    const col = i % 4;
    const numberInRow = twoRows ? Math.min(4, count - row * 4) : count;
    const x = (col - (numberInRow - 1) / 2) * spacing;

    const baseY = twoRows ? (row === 0 ? .29 : -.29) : 0;
    const y = baseY + (c.yOffset || 0);

    const scale = c.baseScale * (c.size || 1) * groupScale;
    slots[c.id].setAttribute("position", `${x} ${y} 0`);
    models[c.id].setAttribute("scale", `${scale} ${scale} ${scale}`);
    loadCharacter(c);
  });
}

function setSettingsOpen(open) {
  controls.classList.toggle("hidden", !open);
  document.getElementById("settingsToggle").textContent = open ? "設定を閉じる" : "設定";
  if (!open) {
    guide.textContent = markerFound ? "マーカーを認識しました" : "梅マークにカメラを向けてください";
  }
}
document.getElementById("doneSettings").addEventListener("click", () => setSettingsOpen(false));
document.getElementById("settingsToggle").addEventListener("click", () => {
  setSettingsOpen(controls.classList.contains("hidden"));
});
document.getElementById("clearSelection").addEventListener("click", () => {
  selected.clear();
  choices.querySelectorAll("input").forEach(input => input.checked = false);
  arrangeCharacters();
  setStatus("キャラクターの選択を解除しました");
});

/* 大学の背景に、カメラの人物だけを合成する */
function getVideo() { return scene.systems["mindar-image-system"]?.video; }
function loadUniversityImage() {
  if (!universityPromise) {
    universityPromise = new Promise((resolve, reject) => {
      const image = new Image();
      image.onload = () => { universityImage = image; resolve(); };
      image.onerror = () => reject(new Error("university.jpgを読み込めません"));
      image.src = "./assets/university.jpg";
    }).catch(error => { universityPromise = null; throw error; });
  }
  return universityPromise;
}
function loadSegmentation() {
  if (segmentationPromise) return segmentationPromise;
  segmentationPromise = new Promise((resolve, reject) => {
    if (window.SelfieSegmentation) return resolve();
    const script = document.createElement("script");
    script.src = SEGMENTATION_CDN + "/selfie_segmentation.js";
    script.onload = resolve;
    script.onerror = () => reject(new Error("人物切り抜き機能を読み込めません"));
    document.head.appendChild(script);
  }).then(() => {
    if (!segmentation) {
      segmentation = new SelfieSegmentation({locateFile: file => SEGMENTATION_CDN + "/" + file});
      segmentation.setOptions({modelSelection: 1});
      segmentation.onResults(drawComposite);
    }
  }).catch(error => { segmentationPromise = null; throw error; });
  return segmentationPromise;
}
function drawCover(ctx, image, w, h) {
  const ratio = Math.max(w / image.naturalWidth, h / image.naturalHeight);
  const sw = w / ratio;
  const sh = h / ratio;
  const sx = (image.naturalWidth - sw) / 2;
  const sy = (image.naturalHeight - sh) / 2;
  ctx.drawImage(image, sx, sy, sw, sh, 0, 0, w, h);
}
function drawComposite(result) {
  if (backgroundMode !== "university" || !universityImage) return;
  const video = getVideo();
  if (!video || !video.videoWidth || !video.videoHeight) return;
  const ratio = Math.min(1, 960 / Math.max(video.videoWidth, video.videoHeight));
  const w = Math.round(video.videoWidth * ratio);
  const h = Math.round(video.videoHeight * ratio);
  if (compositeCanvas.width !== w || compositeCanvas.height !== h) {
    compositeCanvas.width = personCanvas.width = w;
    compositeCanvas.height = personCanvas.height = h;
  }
  personContext.clearRect(0, 0, w, h);
  personContext.globalCompositeOperation = "source-over";
  personContext.drawImage(result.segmentationMask, 0, 0, w, h);
  personContext.globalCompositeOperation = "source-in";
  personContext.drawImage(result.image, 0, 0, w, h);
  personContext.globalCompositeOperation = "source-over";
  compositeContext.clearRect(0, 0, w, h);
  drawCover(compositeContext, universityImage, w, h);
  compositeContext.drawImage(personCanvas, 0, 0);
  compositeReady = true;
  compositeCanvas.style.display = "block";
}
function stopComposite() { compositeReady = false; compositeCanvas.style.display = "none"; }
function segmentationFrame(time) {
  if (backgroundMode !== "university") { backgroundLoopRunning = false; return; }
  requestAnimationFrame(segmentationFrame);
  const video = getVideo();
  if (!segmentation || !video || video.readyState < 2 ||
      segmentationBusy || time - lastSegmentationTime < 110) return;
  segmentationBusy = true;
  lastSegmentationTime = time;
  Promise.resolve(segmentation.send({image:video}))
    .then(() => { segmentationFailures = 0; })
    .catch(error => {
      console.warn(error);
      if (++segmentationFailures >= 3) {
        backgroundMode = "none";
        document.querySelector('input[name="background"][value="none"]').checked = true;
        stopComposite();
        guide.textContent = "大学背景を使えません。カメラ背景に戻しました";
      }
    })
    .finally(() => { segmentationBusy = false; });
}
async function chooseBackground(mode) {
  backgroundMode = mode;
  stopComposite();
  if (mode === "none") { setStatus("カメラの背景にしました"); return; }
  setStatus("大学背景を準備しています…");
  try {
    await Promise.all([loadUniversityImage(), loadSegmentation()]);
    if (backgroundMode !== "university") return;
    if (!backgroundLoopRunning) {
      backgroundLoopRunning = true;
      requestAnimationFrame(segmentationFrame);
    }
  } catch (error) {
    backgroundMode = "none";
    document.querySelector('input[name="background"][value="none"]').checked = true;
    stopComposite();
    setStatus(error.message);
  }
}
document.querySelectorAll('input[name="background"]').forEach(input => {
  input.addEventListener("change", () => { if (input.checked) chooseBackground(input.value); });
});

target.addEventListener("targetFound", () => {
  markerFound = true;
  guide.textContent = "マーカーを認識しました";
  setStatus("選択中：" + selected.size + "体");
});
target.addEventListener("targetLost", () => {
  markerFound = false;
  guide.textContent = "梅マークにカメラを向けてください";
  setStatus("マーカーを探しています");
});
scene.addEventListener("arReady", () => {
  guide.textContent = "梅マークにカメラを向けてください";
  setStatus("ARの準備ができました");
  if (scene.renderer) {
    scene.renderer.setClearColor(0x000000, 0);
    scene.renderer.setClearAlpha(0);
  }
});
scene.addEventListener("arError", () => {
  guide.textContent = "カメラの許可を確認してください";
  setStatus("ARの起動に失敗しました");
});

/* 写真：カメラ映像（または大学背景）と3D描画を合成 */
async function takePhoto() {
  const button = document.getElementById("capture");
  button.disabled = true;

  try {
    const video = getVideo();
    const renderer = scene.renderer;

    if (!video || !renderer || video.readyState < 2) {
      throw new Error("カメラが準備できていません");
    }

    if (!markerFound) {
      throw new Error("梅マーカーを認識してください");
    }

    if (backgroundMode === "university" && !compositeReady) {
      throw new Error("大学背景を準備しています");
    }

    const w = video.videoWidth;
    const h = video.videoHeight;

    /* まずAR画像部分を作る */
    const arImageCanvas = document.createElement("canvas");
    arImageCanvas.width = w;
    arImageCanvas.height = h;
    const arCtx = arImageCanvas.getContext("2d");

    /* 背景 */
    arCtx.drawImage(
      backgroundMode === "university" ? compositeCanvas : video,
      0, 0, w, h
    );

    /* 3D描画 */
    renderer.render(scene.object3D, scene.camera);

    const arCanvas = renderer.domElement;
    const videoAspect = w / h;
    const arAspect = arCanvas.width / arCanvas.height;

    let dw, dh, dx, dy;

    if (arAspect > videoAspect) {
      dw = w;
      dh = w / arAspect;
      dx = 0;
      dy = (h - dh) / 2;
    } else {
      dh = h;
      dw = h * arAspect;
      dx = (w - dw) / 2;
      dy = 0;
    }

    arCtx.drawImage(arCanvas, dx, dy, dw, dh);

    /* 下に文字帯を追加した最終画像を作る */
    const footerHeight = 54;
    const outputCanvas = document.createElement("canvas");
    outputCanvas.width = w;
    outputCanvas.height = h + footerHeight;

    const outCtx = outputCanvas.getContext("2d");

    /* メイン画像 */
    outCtx.drawImage(arImageCanvas, 0, 0);

    /* 下帯 */
    outCtx.fillStyle = "white";
    outCtx.fillRect(0, h, w, footerHeight);

    /* 上の境界線 */
    outCtx.strokeStyle = "#cccccc";
    outCtx.lineWidth = 1;
    outCtx.beginPath();
    outCtx.moveTo(0, h + 0.5);
    outCtx.lineTo(w, h + 0.5);
    outCtx.stroke();

    /* 文字 */
    outCtx.fillStyle = "#333333";
    outCtx.font = "bold 22px sans-serif";
    outCtx.textAlign = "center";
    outCtx.textBaseline = "middle";
    outCtx.fillText(
      footerText,
      w / 2,
      h + footerHeight / 2
    );

    photoBlob = await new Promise((resolve, reject) => {
      outputCanvas.toBlob(blob => {
        if (blob) {
          resolve(blob);
        } else {
          reject(new Error("写真を作成できません"));
        }
      }, "image/png");
    });

    if (photoURL) {
      URL.revokeObjectURL(photoURL);
    }

    photoURL = URL.createObjectURL(photoBlob);
    document.getElementById("photo").src = photoURL;
    document.getElementById("preview").style.display = "flex";

  } catch (error) {
    guide.textContent = "撮影エラー：" + error.message;
    setStatus(error.message);
  } finally {
    button.disabled = false;
  }
}

  
async function savePhoto() {
  if (!photoBlob) return;
  const file = new File([photoBlob], "AR_Photo.png", {type:"image/png"});
  try {
    if (navigator.share && navigator.canShare && navigator.canShare({files:[file]})) {
      await navigator.share({files:[file], title:"AR Photo"});
    } else {
      const a = document.createElement("a");
      a.href = photoURL; a.download = "AR_Photo.png";
      document.body.appendChild(a); a.click(); a.remove();
    }
    closePreview();
  } catch (error) {
    if (error.name !== "AbortError") setStatus("保存・共有できませんでした");
  }
}
function closePreview() {
  document.getElementById("preview").style.display = "none";
  guide.textContent = markerFound ? "マーカーを認識しました" : "梅マークにカメラを向けてください";
}
document.getElementById("capture").addEventListener("click", takePhoto);
document.getElementById("savePhoto").addEventListener("click", savePhoto);
document.getElementById("closePreview").addEventListener("click", closePreview);
scene.addEventListener("loaded", arrangeCharacters);
</script>
</body>
</html>
