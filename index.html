<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0,
             maximum-scale=1.0, user-scalable=no,
             viewport-fit=cover"
  >

  <title>ARフォト</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

      background: transparent;
    }

    /* ====================
       AR
    ==================== */

    #arScene {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      z-index: 1;
    }

    /* ====================
       背景演出
    ==================== */

    #backgroundEffect {
      position: fixed;
      inset: 0;

      z-index: 2;

      display: none;

      width: 100%;
      height: 100%;

      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;

      opacity: 0.32;

      pointer-events: none;
    }

    /* ====================
       UI
    ==================== */

    #ui {
      position: fixed;
      inset: 0;

      z-index: 20;

      pointer-events: none;
    }

    #controlPanel {
      position: absolute;

      top: max(6px, env(safe-area-inset-top));

      left: 50%;
      transform: translateX(-50%);

      width: calc(100% - 16px);
      max-width: 420px;

      padding: 6px 8px;

      border-radius: 13px;

      background:
        rgba(255, 255, 255, 0.88);

      -webkit-backdrop-filter:
        blur(8px);

      backdrop-filter:
        blur(8px);

      pointer-events: auto;
    }

    .controlRow {
      display: flex;
      align-items: center;

      gap: 5px;

      margin: 2px 0;
    }

    .controlLabel {
      flex: 0 0 58px;

      font-size: 11px;
      font-weight: 600;

      color: #555;
    }

    .buttonGroup {
      flex: 1;

      display: flex;

      gap: 4px;
    }

    .selectButton {
      flex: 1;

      min-height: 31px;

      padding: 5px;

      border: 0;
      border-radius: 999px;

      background: #eee;

      color: #333;

      font-size: 11px;
      font-weight: 600;

      white-space: nowrap;
    }

    .selectButton.active {
      background: #222;
      color: #fff;
    }

    /* ====================
       状態表示
    ==================== */

    #status {
      position: absolute;

      left: 50%;
      bottom: 102px;

      transform: translateX(-50%);

      padding: 6px 10px;

      border-radius: 999px;

      background:
        rgba(0, 0, 0, 0.55);

      color: white;

      font-size: 11px;

      white-space: nowrap;
    }

    /* ====================
       シャッター
    ==================== */

    #shutterArea {
      position: absolute;

      left: 0;
      right: 0;

      bottom:
        max(
          15px,
          env(safe-area-inset-bottom)
        );

      display: flex;

      justify-content: center;

      pointer-events: none;
    }

    #shutter {
      width: 62px;
      height: 62px;

      padding: 0;

      border-radius: 50%;

      border:
        5px solid
        rgba(255, 255, 255, 0.95);

      background:
        rgba(255, 255, 255, 0.30);

      box-shadow:
        0 0 0 2px rgba(0, 0, 0, 0.15),
        0 3px 12px rgba(0, 0, 0, 0.25);

      pointer-events: auto;
    }

    /* ====================
       撮影後
    ==================== */

    #preview {
      position: fixed;
      inset: 0;

      z-index: 100;

      display: none;

      flex-direction: column;

      background: #111;
    }

    #previewImage {
      width: 100%;

      flex: 1;

      min-height: 0;

      object-fit: contain;

      background: #111;
    }

    #previewControls {
      min-height: 76px;

      display: flex;

      justify-content: center;
      align-items: center;

      gap: 10px;

      padding:
        10px
        10px
        max(
          10px,
          env(safe-area-inset-bottom)
        );

      background: white;
    }

    #previewControls button {
      min-width: 110px;

      padding: 10px 14px;

      border: 0;

      border-radius: 999px;

      font-size: 13px;
      font-weight: 600;
    }

    #retakeButton {
      background: #eee;
      color: #333;
    }

    #saveButton {
      background: #222;
      color: white;
    }
  </style>
</head>

<body>

  <!-- =========================
       AR
  ========================== -->

  <a-scene

    id="arScene"

    mindar-image="
      imageTargetSrc: ./assets/targets.mind;
      autoStart: true;
      uiLoading: yes;
      uiScanning: yes;
      uiError: yes;
    "

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      preserveDrawingBuffer: true;
      alpha: true;
      antialias: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="
      enabled: false
    "

    embedded
  >

    <!-- 3Dモデル -->

    <a-assets>

      <a-asset-item
        id="umekoAsset"
        src="./assets/umeko.glb">
      </a-asset-item>

      <a-asset-item
        id="zundamonAsset"
        src="./assets/zundamon.glb">
      </a-asset-item>

    </a-assets>


    <!-- 照明 -->

    <a-entity
      light="
        type: ambient;
        intensity: 1.4;
      ">
    </a-entity>

    <a-entity
      light="
        type: directional;
        intensity: 1.2;
      "
      position="1 2 2">
    </a-entity>


    <!-- =========================
         マーカー
    ========================== -->

    <a-entity
      id="target"
      mindar-image-target="
        targetIndex: 0
      "
    >

      <!-- 津田梅子 -->

      <a-gltf-model

        id="umeko"

        src="#umekoAsset"

        position="0 0 0"

        rotation="-90 0 0"

        scale="
          0.5
          0.5
          0.5
        "

        visible="true">

      </a-gltf-model>


      <!-- ずんだもん -->

      <a-gltf-model

        id="zundamon"

        src="#zundamonAsset"

        position="0 0 0"

        rotation="0 0 0"

        scale="
          0.5
          0.5
          0.5
        "

        visible="false">

      </a-gltf-model>

    </a-entity>


    <!-- カメラ -->

    <a-camera

      position="0 0 0"

      look-controls="
        enabled: false
      ">

    </a-camera>

  </a-scene>


  <!-- =========================
       背景
  ========================== -->

  <div id="backgroundEffect"></div>


  <!-- =========================
       UI
  ========================== -->

  <div id="ui">

    <div id="controlPanel">

      <!-- キャラクター -->

      <div class="controlRow">

        <div class="controlLabel">
          キャラ
        </div>

        <div class="buttonGroup">

          <button
            id="umekoButton"
            class="selectButton active"
            type="button">

            津田梅子

          </button>

          <button
            id="zundamonButton"
            class="selectButton"
            type="button">

            ずんだもん

          </button>

        </div>

      </div>


      <!-- 背景 -->

      <div class="controlRow">

        <div class="controlLabel">
          背景
        </div>

        <div class="buttonGroup">

          <button
            id="normalButton"
            class="selectButton active"
            type="button">

            通常

          </button>

          <button
            id="airportButton"
            class="selectButton"
            type="button">

            空港

          </button>

          <button
            id="universityButton"
            class="selectButton"
            type="button">

            大学

          </button>

        </div>

      </div>

    </div>


    <div id="status">
      マーカーにカメラを向けてください
    </div>


    <div id="shutterArea">

      <button
        id="shutter"
        type="button"
        aria-label="写真を撮る">
      </button>

    </div>

  </div>


  <!-- =========================
       撮影後
  ========================== -->

  <div id="preview">

    <img
      id="previewImage"
      alt="撮影したAR写真"
    >

    <div id="previewControls">

      <button
        id="retakeButton"
        type="button">

        撮り直す

      </button>

      <button
        id="saveButton"
        type="button">

        写真に保存

      </button>

    </div>

  </div>


<script>

  const scene =
    document.querySelector("#arScene");

  const target =
    document.querySelector("#target");

  const umeko =
    document.querySelector("#umeko");

  const zundamon =
    document.querySelector("#zundamon");


  const umekoButton =
    document.querySelector("#umekoButton");

  const zundamonButton =
    document.querySelector("#zundamonButton");


  const normalButton =
    document.querySelector("#normalButton");

  const airportButton =
    document.querySelector("#airportButton");

  const universityButton =
    document.querySelector(
      "#universityButton"
    );


  const backgroundEffect =
    document.querySelector(
      "#backgroundEffect"
    );


  const status =
    document.querySelector("#status");


  const shutter =
    document.querySelector("#shutter");


  const preview =
    document.querySelector("#preview");


  const previewImage =
    document.querySelector(
      "#previewImage"
    );


  const retakeButton =
    document.querySelector(
      "#retakeButton"
    );


  const saveButton =
    document.querySelector(
      "#saveButton"
    );


  let currentBackground =
    "normal";


  let capturedBlob =
    null;


  /* =========================
     キャラクター切替
  ========================== */

  function selectCharacter(name) {

    const showUmeko =
      name === "umeko";


    umeko.setAttribute(
      "visible",
      showUmeko
    );


    zundamon.setAttribute(
      "visible",
      !showUmeko
    );


    umekoButton.classList.toggle(
      "active",
      showUmeko
    );


    zundamonButton.classList.toggle(
      "active",
      !showUmeko
    );
  }


  umekoButton.addEventListener(
    "click",
    () => {

      selectCharacter("umeko");

    }
  );


  zundamonButton.addEventListener(
    "click",
    () => {

      selectCharacter("zundamon");

    }
  );


  /* =========================
     背景
  ========================== */

  function selectBackground(type) {

    currentBackground =
      type;


    normalButton.classList.remove(
      "active"
    );


    airportButton.classList.remove(
      "active"
    );


    universityButton.classList.remove(
      "active"
    );


    if (type === "normal") {

      normalButton.classList.add(
        "active"
      );


      backgroundEffect.style.display =
        "none";


      backgroundEffect.style.backgroundImage =
        "none";

    }


    if (type === "airport") {

      airportButton.classList.add(
        "active"
      );


      backgroundEffect.style.backgroundImage =
        "url('./assets/airport.jpg')";


      backgroundEffect.style.display =
        "block";

    }


    if (type === "university") {

      universityButton.classList.add(
        "active"
      );


      backgroundEffect.style.backgroundImage =
        "url('./assets/university.jpg')";


      backgroundEffect.style.display =
        "block";

    }

  }


  normalButton.addEventListener(
    "click",
    () => {

      selectBackground("normal");

    }
  );


  airportButton.addEventListener(
    "click",
    () => {

      selectBackground("airport");

    }
  );


  universityButton.addEventListener(
    "click",
    () => {

      selectBackground(
        "university"
      );

    }
  );


  /* =========================
     マーカー認識
  ========================== */

  target.addEventListener(
    "targetFound",
    () => {

      status.textContent =
        "AR表示中";

    }
  );


  target.addEventListener(
    "targetLost",
    () => {

      status.textContent =
        "マーカーにカメラを向けてください";

    }
  );


  /* =========================
     撮影
  ========================== */

  shutter.addEventListener(
    "click",
    capturePhoto
  );


  function capturePhoto() {

    if (
      !scene.renderer ||
      !scene.renderer.domElement
    ) {

      alert(
        "ARの準備中です。少し待ってください。"
      );

      return;
    }


    const arCanvas =
      scene.renderer.domElement;


    const width =
      arCanvas.width;


    const height =
      arCanvas.height;


    const outputCanvas =
      document.createElement(
        "canvas"
      );


    outputCanvas.width =
      width;


    outputCanvas.height =
      height;


    const ctx =
      outputCanvas.getContext(
        "2d"
      );


    ctx.drawImage(
      arCanvas,
      0,
      0,
      width,
      height
    );


    if (
      currentBackground !==
      "normal"
    ) {

      const image =
        new Image();


      image.onload =
        () => {


          ctx.save();


          ctx.globalAlpha =
            0.32;


          drawCoverImage(
            ctx,
            image,
            width,
            height
          );


          ctx.restore();


          finishCapture(
            outputCanvas
          );

        };


      if (
        currentBackground ===
        "airport"
      ) {

        image.src =
          "./assets/airport.jpg";

      }


      if (
        currentBackground ===
        "university"
      ) {

        image.src =
          "./assets/university.jpg";

      }


      return;
    }


    finishCapture(
      outputCanvas
    );

  }


  /* =========================
     撮影完了
  ========================== */

  function finishCapture(canvas) {

    canvas.toBlob(

      blob => {

        if (!blob) {

          alert(
            "写真を作成できませんでした。"
          );

          return;

        }


        capturedBlob =
          blob;


        previewImage.src =
          URL.createObjectURL(
            blob
          );


        preview.style.display =
          "flex";

      },

      "image/png",

      1

    );

  }


  /* =========================
     背景画像
  ========================== */

  function drawCoverImage(
    ctx,
    image,
    canvasWidth,
    canvasHeight
  ) {

    const imageRatio =
      image.naturalWidth /
      image.naturalHeight;


    const canvasRatio =
      canvasWidth /
      canvasHeight;


    let sourceWidth;
    let sourceHeight;
    let sourceX;
    let sourceY;


    if (
      imageRatio >
      canvasRatio
    ) {

      sourceHeight =
        image.naturalHeight;


      sourceWidth =
        sourceHeight *
        canvasRatio;


      sourceX =
        (
          image.naturalWidth -
          sourceWidth
        ) / 2;


      sourceY =
        0;

    } else {

      sourceWidth =
        image.naturalWidth;


      sourceHeight =
        sourceWidth /
        canvasRatio;


      sourceX =
        0;


      sourceY =
        (
          image.naturalHeight -
          sourceHeight
        ) / 2;

    }


    ctx.drawImage(

      image,

      sourceX,
      sourceY,

      sourceWidth,
      sourceHeight,

      0,
      0,

      canvasWidth,
      canvasHeight

    );

  }


  /* =========================
     撮り直し
  ========================== */

  retakeButton.addEventListener(
    "click",
    () => {

      preview.style.display =
        "none";


      if (
        previewImage.src
      ) {

        URL.revokeObjectURL(
          previewImage.src
        );

      }


      previewImage.removeAttribute(
        "src"
      );


      capturedBlob =
        null;

    }
  );


  /* =========================
     保存
  ========================== */

  saveButton.addEventListener(
    "click",
    async () => {

      if (!capturedBlob) {
        return;
      }


      const file =
        new File(

          [capturedBlob],

          "ar-photo.png",

          {
            type:
              "image/png"
          }

        );


      if (
        navigator.share &&
        navigator.canShare &&
        navigator.canShare({
          files: [file]
        })
      ) {

        try {

          await navigator.share({

            files: [file],

            title:
              "AR Photo"

          });


          preview.style.display =
            "none";


          return;

        } catch (error) {

          if (
            error.name ===
            "AbortError"
          ) {

            return;

          }


          console.error(
            error
          );

        }

      }


      const url =
        URL.createObjectURL(
          capturedBlob
        );


      const a =
        document.createElement(
          "a"
        );


      a.href =
        url;


      a.download =
        "ar-photo.png";


      document.body.appendChild(
        a
      );


      a.click();


      a.remove();


      setTimeout(
        () => {

          URL.revokeObjectURL(
            url
          );

        },

        1000
      );


      preview.style.display =
        "none";

    }
  );


  /* =========================
     初期設定
  ========================== */

  selectCharacter(
    "umeko"
  );


  selectBackground(
    "normal"
  );

</script>

</body>
</html>
