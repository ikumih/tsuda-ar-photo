<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
                 maximum-scale=1.0, user-scalable=no">

  <title>ARフォト</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
      background: #111;
    }

    #guide {
      position: fixed;
      z-index: 20;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: 94%;
      padding: 10px 15px;
      border-radius: 20px;
      background: rgba(255,255,255,0.92);
      color: #333;
      text-align: center;
      font-size: 13px;
      pointer-events: none;
    }

    #controls {
      position: fixed;
      z-index: 30;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 96%;
      max-width: 500px;
      padding: 12px;
      border-radius: 18px;
      background: rgba(255,255,255,0.92);
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 10px;
    }

    button {
      border: 1px solid #ccc;
      border-radius: 12px;
      padding: 11px 8px;
      background: white;
      color: #333;
      font-size: 13px;
      cursor: pointer;
      flex: 1;
    }

    button.active {
      background: #dceff5;
      border: 2px solid #58a6bc;
      font-weight: bold;
    }

    #capture {
      width: 100%;
      background: #333;
      color: white;
      font-size: 16px;
      padding: 13px;
    }

    #capture:disabled {
      opacity: 0.5;
    }

    #status {
      margin-top: 7px;
      text-align: center;
      font-size: 11px;
      color: #555;
    }

    #preview {
      display: none;
      position: fixed;
      z-index: 100;
      inset: 0;
      background: rgba(0,0,0,0.94);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 15px;
    }

    #photo {
      max-width: 100%;
      max-height: 70vh;
      object-fit: contain;
    }

    .previewButtons {
      display: flex;
      width: 100%;
      max-width: 400px;
      gap: 10px;
    }

    .previewButtons button {
      padding: 14px;
      font-size: 15px;
    }
  </style>

  <script>
    // 恐竜をリギングなしで左右に揺らす
    AFRAME.registerComponent("dino-sway", {
      tick: function(time) {
        const t = time / 1000;
        this.el.object3D.rotation.y =
          Math.sin(t * 1.5) * 0.10;
      }
    });
  </script>
</head>

<body>

  <div id="guide">
    ARを起動しています...
  </div>

  <div id="controls">

    <div class="buttons">
      <button id="btn-umeko" class="active"
              onclick="selectCharacter('umeko')">
        津田梅子
      </button>

      <button id="btn-zundamon"
              onclick="selectCharacter('zundamon')">
        ずんだもん
      </button>

      <button id="btn-dino"
              onclick="selectCharacter('dino')">
        恐竜
      </button>
    </div>

    <button id="capture" onclick="takePhoto()">
      写真を撮る
    </button>

    <div id="status">
      カメラを準備しています
    </div>

  </div>

  <div id="preview">

    <img id="photo" alt="撮影したAR写真">

    <div class="previewButtons">
      <button onclick="savePhoto()">
        保存・共有
      </button>

      <button onclick="closePreview()">
        ARに戻る
      </button>
    </div>

  </div>

  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: ./assets/targets.mind;
                 autoStart: true;
                 uiScanning: yes;
                 uiLoading: yes;"
    embedded
    renderer="colorManagement: true;
              physicallyCorrectLights: true;
              preserveDrawingBuffer: true;
              alpha: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets timeout="30000">

      <a-asset-item
        id="asset-umeko"
        src="./assets/umeko.glb">
      </a-asset-item>

      <a-asset-item
        id="asset-zundamon"
        src="./assets/zundamon.glb">
      </a-asset-item>

      <a-asset-item
        id="asset-dino"
        src="./assets/T_Rex.glb">
      </a-asset-item>

    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0">

      <!-- 津田梅子 -->
      <a-gltf-model
        id="model-umeko"
        src="#asset-umeko"
        position="0 0 0"
        rotation="90 0 0"
        scale="1.5 1.5 1.5"
        visible="true">
      </a-gltf-model>

      <!-- ずんだもん -->
      <a-gltf-model
        id="model-zundamon"
        src="#asset-zundamon"
        position="0 0 0"
        rotation="90 0 0"
        scale="1.5 1.5 1.5"
        visible="false">
      </a-gltf-model>

      <!-- ティラノサウルス -->
      <a-gltf-model
        id="model-dino"
        src="#asset-dino"
        position="0 0 0"
        rotation="90 0 0"
        scale="1 1 1"
        dino-sway
        visible="false">
      </a-gltf-model>

    </a-entity>

  </a-scene>

  <script>
    let currentCharacter = "umeko";
    let markerFound = false;
    let photoBlob = null;
    let photoURL = null;

    const names = {
      umeko: "津田梅子",
      zundamon: "ずんだもん",
      dino: "恐竜"
    };

    const modelIds = [
      "umeko",
      "zundamon",
      "dino"
    ];

    const guide = document.getElementById("guide");
    const status = document.getElementById("status");
    const scene = document.getElementById("scene");
    const target = document.getElementById("target");

    // キャラクター切り替え
    function selectCharacter(name) {

      currentCharacter = name;

      modelIds.forEach(id => {

        const model =
          document.getElementById("model-" + id);

        const button =
          document.getElementById("btn-" + id);

        model.setAttribute(
          "visible",
          id === name
        );

        button.classList.toggle(
          "active",
          id === name
        );

      });

      status.textContent =
        names[name] + "を選択しました";

    }

    // マーカー認識
    target.addEventListener("targetFound", () => {
      markerFound = true;
      guide.textContent = "マーカーを認識しました";
      status.textContent =
        names[currentCharacter] + "を表示中";
    });

    target.addEventListener("targetLost", () => {
      markerFound = false;
      guide.textContent =
        "梅マークにカメラを向けてください";
      status.textContent =
        "マーカーを探しています";
    });

    // AR起動状態
    scene.addEventListener("loaded", () => {
      guide.textContent =
        "梅マークにカメラを向けてください";
    });

    scene.addEventListener("arReady", () => {
      status.textContent =
        "ARの準備ができました";
    });

    scene.addEventListener("arError", () => {
      status.textContent =
        "AR起動エラー：カメラの許可を確認してください";
    });

    // 3Dモデル読み込み状態
    modelIds.forEach(id => {

      const model =
        document.getElementById("model-" + id);

      model.addEventListener("model-loaded", () => {
        console.log(id + " loaded");
      });

      model.addEventListener("model-error", () => {
        status.textContent =
          names[id] + "の3Dモデルを読み込めません";
      });

    });

    // 写真撮影
    async function takePhoto() {

      const button =
        document.getElementById("capture");

      button.disabled = true;

      try {

        const arSystem =
          scene.systems["mindar-image-system"];

        const video =
          arSystem &&
          arSystem.video;

        const renderer =
          scene.renderer;

        if (!video ||
            !renderer ||
            video.readyState < 2) {
          throw new Error(
            "カメラがまだ準備できていません"
          );
        }

        if (!markerFound) {
          throw new Error(
            "梅マーカーを認識してから撮影してください"
          );
        }

        const width =
          video.videoWidth;

        const height =
          video.videoHeight;

        if (!width || !height) {
          throw new Error(
            "カメラの画像サイズを取得できません"
          );
        }

        // カメラ画像と3D描画を合成
        const canvas =
          document.createElement("canvas");

        canvas.width = width;
        canvas.height = height;

        const ctx =
          canvas.getContext("2d");

        ctx.drawImage(
          video,
          0, 0,
          width, height
        );

        // A-Frame側の最新フレームを描画
        renderer.render(
          scene.object3D,
          scene.camera
        );

        const arCanvas =
          renderer.domElement;

        const videoAspect = width / height;
        const arAspect =
          arCanvas.width / arCanvas.height;

        let drawWidth, drawHeight;
        let offsetX, offsetY;

        // AR描画のアスペクト比を維持して合成
        if (arAspect > videoAspect) {

          drawWidth = width;
          drawHeight = width / arAspect;

          offsetX = 0;
          offsetY = (height - drawHeight) / 2;

        } else {

          drawHeight = height;
          drawWidth = height * arAspect;

          offsetX = (width - drawWidth) / 2;
          offsetY = 0;

        }

        ctx.drawImage(
          arCanvas,
          offsetX,
          offsetY,
          drawWidth,
          drawHeight
        );

        photoBlob = await new Promise(
          (resolve, reject) => {
            canvas.toBlob(
              blob => blob
                ? resolve(blob)
                : reject(new Error("画像を作成できません")),
              "image/png"
            );
          }
        );

        if (photoURL) {
          URL.revokeObjectURL(photoURL);
        }

        photoURL =
          URL.createObjectURL(photoBlob);

        document.getElementById("photo").src =
          photoURL;

        document.getElementById("preview")
          .style.display = "flex";

      } catch (error) {

        status.textContent =
          "撮影エラー：" + error.message;

      } finally {

        button.disabled = false;

      }
    }

    // 写真を保存・共有
    async function savePhoto() {

      if (!photoBlob) return;

      const file = new File(
        [photoBlob],
        "AR_Photo.png",
        { type: "image/png" }
      );

      try {

        if (
          navigator.canShare &&
          navigator.canShare({ files: [file] }) &&
          navigator.share
        ) {

          await navigator.share({
            files: [file],
            title: "AR Photo"
          });

        } else {

          const link =
            document.createElement("a");

          link.href = photoURL;
          link.download = "AR_Photo.png";

          document.body.appendChild(link);
          link.click();
          link.remove();

        }

        closePreview();

      } catch (error) {

        if (error.name !== "AbortError") {
          status.textContent =
            "保存・共有に失敗しました";
        }

      }
    }

    // 撮影画面からARに戻る
    function closePreview() {

      document.getElementById("preview")
        .style.display = "none";

      guide.textContent = markerFound
        ? "マーカーを認識しました"
        : "梅マークにカメラを向けてください";

    }

  </script>

</body>
</html>
