<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no">

  <title>津田 AR Photo</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    a-scene {
      position: fixed !important;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
      renderer="colorManagement: true; physicallyCorrectLights: true; preserveDrawingBuffer: true"
    }
    #photoButton {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  width: 72px;
  height: 72px;
  border-radius: 50%;
  border: 5px solid white;
  background: rgba(255,255,255,0.35);
  z-index: 9999;
}
  </style>
</head>

<body>

<a-scene
  mindar-image="imageTargetSrc: ./assets/ume-marker.mind;
                filterMinCF: 0.001;
                filterBeta: 0.01;
                warmupTolerance: 5;
                missTolerance: 20;"
  embedded
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <a-asset-item
      id="zundamon"
      src="./assets/zundamon.glb">
    </a-asset-item>
  </a-assets>

  <a-entity mindar-image-target="targetIndex: 0">

<a-gltf-model
  src="#zundamon"
  position="1.１ 0 0"
  rotation="90 0 0"
  scale="2.3 2.3 2.3"
  animation="property: scale; from: 2.3 2.3 2.3; to: 2.3 2.45 2.3; dur: 600; dir: alternate; loop: true; easing: easeInOutQuad">
</a-gltf-model>

  </a-entity>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

</a-scene>
<button id="photoButton" aria-label="写真を撮る"></button>
<script>
document.getElementById("photoButton").addEventListener("click", () => {

  const video = document.querySelector("video");
  const scene = document.querySelector("a-scene");

  if (!video || !scene || !scene.renderer) {
    alert("ARカメラの準備ができていません");
    return;
  }

  // 撮影直前にARを明示的に再描画
  scene.renderer.render(scene.object3D, scene.camera);

  requestAnimationFrame(() => {

    const arCanvas = scene.canvas;

    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const ctx = canvas.getContext("2d");

    // 1. カメラ映像
    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );

    // 2. AR（ずんだもん）
    ctx.drawImage(
      arCanvas,
      0,
      0,
      canvas.width,
      canvas.height
    );

    // 3. 撮影結果
    const image = canvas.toDataURL("image/png");

    const preview = window.open("", "_blank");

    preview.document.write(`
      <!DOCTYPE html>
      <html>
      <head>
        <meta name="viewport"
              content="width=device-width, initial-scale=1.0">
        <title>AR Photo</title>
        <style>
          body {
            margin: 0;
            background: black;
          }

          img {
            width: 100%;
            height: auto;
            display: block;
          }
        </style>
      </head>

      <body>
        <img src="${image}">
      </body>
      </html>
    `);

  });
});
</script>
  
</body>
</html>
