<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             user-scalable=no,
             viewport-fit=cover"
  >

  <title>津田 AR Photo</title>


  <!-- 元の動作版と同じ -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
    }


    /* =========================
       AR
    ========================= */

    a-scene {
      position: fixed !important;

      top: 0;
      left: 0;

      width: 100% !important;
      height: 100% !important;
    }


    /* =========================
       背景画像
       AR認識を邪魔しない
    ========================= */

    #backgroundEffect {

      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      z-index: 10;

      display: none;

      pointer-events: none;

      background-size: cover;
      background-position: center;

      opacity: 0.30;
    }


    /* =========================
       上部操作
    ========================= */

    #controls {

      position: fixed;

      top: max(
        8px,
        env(safe-area-inset-top)
      );

      left: 50%;

      transform:
        translateX(-50%);

      width:
        calc(100% - 16px);

      max-width: 430px;

      z-index: 9998;

      padding: 6px 8px;

      border-radius: 13px;

      background:
        rgba(255,255,255,0.88);

      backdrop-filter:
        blur(8px);

      -webkit-backdrop-filter:
        blur(8px);
    }


    .controlRow {

      display: flex;

      align-items: center;

      gap: 5px;

      margin: 2px 0;
    }


    .controlLabel {

      width: 55px;

      flex-shrink: 0;

      font-size: 11px;

      font-weight: 600;

      color: #555;
    }


    .buttonGroup {

      display: flex;

      flex: 1;

      gap: 4px;
    }


    .selectButton {

      flex: 1;

      min-height: 31px;

      border: none;

      border-radius: 999px;

      padding: 5px;

      background: #eee;

      color: #333;

      font-size: 11px;

      font-weight: 600;
    }


    .selectButton.active {

      background: #222;

      color: white;
    }


    /* =========================
       撮影ボタン
    ========================= */

    #photoButton {

      position: fixed;

      bottom:
        max(
          20px,
          env(safe-area-inset-bottom)
        );

      left: 50%;

      transform:
        translateX(-50%);

      width: 64px;
      height: 64px;

      border-radius: 50%;

      border:
        5px solid white;

      background:
        rgba(255,255,255,0.35);

      z-index: 9999;
    }

  </style>

</head>


<body>



<!-- =========================
     AR
========================= -->

<a-scene

  id="arScene"

  mindar-image="
    imageTargetSrc: ./assets/ume-marker.mind;
    filterMinCF: 0.001;
    filterBeta: 0.01;
    warmupTolerance: 5;
    missTolerance: 20;
  "

  embedded

  color-space="sRGB"

  renderer="
    colorManagement: true;
    physicallyCorrectLights: true;
    preserveDrawingBuffer: true;
  "

  vr-mode-ui="enabled: false"

  device-orientation-permission-ui="
    enabled: false
  ">


  <!-- =========================
       モデル
  ========================= -->

  <a-assets>


    <a-asset-item
      id="umekoModel"
      src="./assets/umeko.glb">
    </a-asset-item>


    <a-asset-item
      id="zundamonModel"
      src="./assets/zundamon.glb">
    </a-asset-item>


  </a-assets>



  <!-- =========================
       マーカー
  ========================= -->

  <a-entity

    id="markerTarget"

    mindar-image-target="
      targetIndex: 0
    ">


    <!-- 津田梅子 -->

    <a-gltf-model

      id="umeko"

      src="#umekoModel"

      position="0 0 0"

      rotation="0 0 0"

      scale="0.5 0.5 0.5"

      visible="true">

    </a-gltf-model>



    <!-- ずんだもん -->

    <a-gltf-model

      id="zundamon"

      src="#zundamonModel"

      position="1.1 0 0"

      rotation="90 0 0"

      scale="2.3 2.3 2.3"

      visible="false"

      animation="
        property: scale;
        from: 2.3 2.3 2.3;
        to: 2.3 2.45 2.3;
        dur: 600;
        dir: alternate;
        loop: true;
        easing: easeInOutQuad;
      ">

    </a-gltf-model>


  </a-entity>



  <!-- カメラ -->

  <a-camera

    position="0 0 0"

    look-controls="
      enabled: false
    ">

  </a-camera>


</a-scene>



<!-- =========================
     背景演出
========================= -->

<div id="backgroundEffect"></div>



<!-- =========================
     操作パネル
========================= -->

<div id="controls">


  <!-- キャラクター -->

  <div class="controlRow">


    <div class="controlLabel">
      キャラ
    </div>


    <div class="buttonGroup">


      <button

        id="umekoButton"

        class="
          selectButton
          active
        ">

        津田梅子

      </button>


      <button

        id="zundamonButton"

        class="selectButton">

        ずんだもん

      </button>


    </div>

  </div>



  <!-- 背景 -->

  <div class="controlRow">


    <div class="controlLabel">
      背景
    </div>


    <div class="buttonGroup">


      <button

        id="normalButton"

        class="
          selectButton
          active
        ">

        通常

      </button>


      <button

        id="airportButton"

        class="selectButton">

        空港

      </button>


      <button

        id="universityButton"

        class="selectButton">

        大学

      </button>


    </div>

  </div>


</div>



<!-- =========================
     撮影
========================= -->

<button

  id="photoButton"

  aria-label="写真を撮る">

</button>



<script>


/* ========================================
   キャラクター
======================================== */


const umeko =
  document.querySelector("#umeko");


const zundamon =
  document.querySelector("#zundamon");


const umekoButton =
  document.querySelector("#umekoButton");


const zundamonButton =
  document.querySelector("#zundamonButton");



function selectCharacter(name) {


  const showUmeko =
    name === "umeko";


  umeko.setAttribute(
    "visible",
    showUmeko
  );


  zundamon.setAttribute(
    "visible",
    !showUmeko
  );


  umekoButton.classList.toggle(
    "active",
    showUmeko
  );


  zundamonButton.classList.toggle(
    "active",
    !showUmeko
  );

}



umekoButton.addEventListener(
  "click",
  () => {

    selectCharacter("umeko");

  }
);



zundamonButton.addEventListener(
  "click",
  () => {

    selectCharacter("zundamon");

  }
);



/* ========================================
   背景
======================================== */


const backgroundEffect =
  document.querySelector(
    "#backgroundEffect"
  );


const normalButton =
  document.querySelector(
    "#normalButton"
  );


const airportButton =
  document.querySelector(
    "#airportButton"
  );


const universityButton =
  document.querySelector(
    "#universityButton"
  );


let currentBackground =
  "normal";



function selectBackground(type) {


  currentBackground =
    type;


  normalButton.classList.remove(
    "active"
  );


  airportButton.classList.remove(
    "active"
  );


  universityButton.classList.remove(
    "active"
  );



  if (type === "normal") {


    normalButton.classList.add(
      "active"
    );


    backgroundEffect.style.display =
      "none";


    backgroundEffect.style.backgroundImage =
      "none";

  }



  if (type === "airport") {


    airportButton.classList.add(
      "active"
    );


    backgroundEffect.style.backgroundImage =
      "url('./assets/airport.jpg')";


    backgroundEffect.style.display =
      "block";

  }



  if (type === "university") {


    universityButton.classList.add(
      "active"
    );


    backgroundEffect.style.backgroundImage =
      "url('./assets/university.jpg')";


    backgroundEffect.style.display =
      "block";

  }

}



normalButton.addEventListener(
  "click",
  () => {

    selectBackground(
      "normal"
    );

  }
);



airportButton.addEventListener(
  "click",
  () => {

    selectBackground(
      "airport"
    );

  }
);



universityButton.addEventListener(
  "click",
  () => {

    selectBackground(
      "university"
    );

  }
);



/* ========================================
   写真撮影

   ここは動いていたコードを
   基本的にそのまま使用
======================================== */


document
  .getElementById("photoButton")
  .addEventListener(
    "click",
    () => {


      const video =
        document.querySelector(
          "video"
        );


      const scene =
        document.querySelector(
          "a-scene"
        );



      if (
        !video ||
        !scene ||
        !scene.renderer
      ) {


        alert(
          "ARカメラの準備ができていません"
        );


        return;

      }



      /* 撮影直前にAR再描画 */

      scene.renderer.render(
        scene.object3D,
        scene.camera
      );



      requestAnimationFrame(
        () => {


          const arCanvas =
            scene.canvas;


          const canvas =
            document.createElement(
              "canvas"
            );


          canvas.width =
            video.videoWidth;


          canvas.height =
            video.videoHeight;


          const ctx =
            canvas.getContext(
              "2d"
            );



          /* =====================
             カメラ映像
          ===================== */

          ctx.drawImage(

            video,

            0,
            0,

            canvas.width,
            canvas.height

          );



          /* =====================
             ARモデル
          ===================== */

          ctx.drawImage(

            arCanvas,

            0,
            0,

            canvas.width,
            canvas.height

          );



          /* =====================
             背景演出
             撮影画像にも追加
          ===================== */

          if (
            currentBackground !==
            "normal"
          ) {


            const bg =
              new Image();


            bg.onload =
              () => {


                ctx.save();


                ctx.globalAlpha =
                  0.30;


                ctx.drawImage(

                  bg,

                  0,
                  0,

                  canvas.width,
                  canvas.height

                );


                ctx.restore();


                addPhotoFrame(
                  canvas,
                  ctx
                );

              };


            if (
              currentBackground ===
              "airport"
            ) {

              bg.src =
                "./assets/airport.jpg";

            }


            if (
              currentBackground ===
              "university"
            ) {

              bg.src =
                "./assets/university.jpg";

            }


          } else {


            addPhotoFrame(
              canvas,
              ctx
            );

          }


        }
      );

    }
  );



/* ========================================
   写真フレーム
======================================== */


function addPhotoFrame(
  canvas,
  ctx
) {


  const bandHeight =
    canvas.height * 0.10;



  ctx.fillStyle =
    "rgba(0,0,0,0.55)";


  ctx.fillRect(

    0,

    canvas.height -
      bandHeight,

    canvas.width,

    bandHeight

  );



  ctx.fillStyle =
    "white";


  ctx.textAlign =
    "center";


  ctx.textBaseline =
    "middle";



  ctx.font =
    `bold ${
      Math.round(
        canvas.width * 0.050
      )
    }px sans-serif`;



  ctx.fillText(

    "津田塾大学",

    canvas.width / 2,

    canvas.height -
      bandHeight * 0.62

  );



  ctx.font =
    `${
      Math.round(
        canvas.width * 0.027
      )
    }px sans-serif`;



  ctx.fillText(

    "AR PHOTO",

    canvas.width / 2,

    canvas.height -
      bandHeight * 0.25

  );



  createPhoto(
    canvas
  );

}



/* ========================================
   写真作成
======================================== */


function createPhoto(canvas) {


  canvas.toBlob(

    blob => {


      const imageUrl =
        URL.createObjectURL(
          blob
        );


      const preview =
        window.open(
          "",
          "_blank"
        );


      preview.document.write(`

<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="
    width=device-width,
    initial-scale=1.0
  "
>

<title>
AR Photo
</title>


<style>

* {
  box-sizing:
    border-box;
}


html,
body {

  margin: 0;
  padding: 0;

  background: #111;

  color: white;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    sans-serif;
}


.container {

  min-height: 100vh;

  display: flex;

  flex-direction: column;

  align-items: center;
}


.photo {

  width: 100%;

  display: block;
}


.buttons {

  width: 100%;

  padding: 18px;

  display: flex;

  gap: 12px;
}


button {

  flex: 1;

  min-height: 56px;

  border-radius: 14px;

  border: none;

  font-size: 17px;

  font-weight: 600;
}


.save {

  background: white;

  color: #111;
}


.retry {

  background: #444;

  color: white;
}


.note {

  padding:
    0 20px 20px;

  font-size: 13px;

  color: #bbb;

  text-align: center;
}

</style>

</head>


<body>


<div class="container">


<img

  class="photo"

  src="${imageUrl}"

  alt="撮影したAR写真"

>


<div class="buttons">


<button

  class="retry"

  onclick="
    window.close()
  ">

  撮り直す

</button>



<button

  class="save"

  id="saveButton">

  写真に保存

</button>


</div>


<div class="note">

「写真に保存」を押して、
共有画面から
「画像を保存」を選んでください。

</div>


</div>



<script>


document
  .getElementById(
    "saveButton"
  )
  .addEventListener(
    "click",
    async () => {


      try {


        const response =
          await fetch(
            "${imageUrl}"
          );


        const blob =
          await response.blob();


        const file =
          new File(

            [blob],

            "tsuda-ar-photo.png",

            {
              type:
                "image/png"
            }

          );



        if (

          navigator.share &&

          navigator.canShare &&

          navigator.canShare({
            files: [file]
          })

        ) {


          await navigator.share({

            files: [file],

            title:
              "AR Photo"

          });


          window.close();


        } else {


          alert(
            "写真を長押しして「写真に保存」を選んでください。"
          );

        }


      } catch (error) {


        console.error(
          error
        );


        alert(
          "写真を長押しして「写真に保存」を選んでください。"
        );

      }


    }
  );


<\/script>


</body>

</html>

      `);


      preview.document.close();


    },

    "image/png"

  );

}



/* 初期状態 */

selectCharacter(
  "umeko"
);


selectBackground(
  "normal"
);


</script>


</body>

</html>
