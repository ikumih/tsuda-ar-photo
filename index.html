<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             user-scalable=no,
             viewport-fit=cover"
  >

  <title>津田 AR Photo</title>


  <!-- 動作確認できていた版と同じ -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
    }


    /* =========================
       AR
    ========================= */

    a-scene {
      position: fixed !important;

      top: 0;
      left: 0;

      width: 100% !important;
      height: 100% !important;
    }


    /* =========================
       背景画像
    ========================= */

    #backgroundEffect {

      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      z-index: 10;

      display: none;

      pointer-events: none;

      background-size: cover;
      background-position: center;

      opacity: 0.30;
    }


    /* =========================
       上部操作
    ========================= */

    #controls {

      position: fixed;

      top: max(
        8px,
        env(safe-area-inset-top)
      );

      left: 50%;

      transform:
        translateX(-50%);

      width:
        calc(100% - 16px);

      max-width: 430px;

      z-index: 9998;

      padding: 6px 8px;

      border-radius: 13px;

      background:
        rgba(255,255,255,0.88);

      backdrop-filter:
        blur(8px);

      -webkit-backdrop-filter:
        blur(8px);
    }


    .controlRow {

      display: flex;

      align-items: center;

      gap: 5px;

      margin: 2px 0;
    }


    .controlLabel {

      width: 55px;

      flex-shrink: 0;

      font-size: 11px;

      font-weight: 600;

      color: #555;
    }


    .buttonGroup {

      display: flex;

      flex: 1;

      gap: 4px;
    }


    .selectButton {

      flex: 1;

      min-height: 31px;

      border: none;

      border-radius: 999px;

      padding: 5px;

      background: #eee;

      color: #333;

      font-size: 11px;

      font-weight: 600;
    }


    .selectButton.active {

      background: #222;

      color: white;
    }


    /* =========================
       撮影ボタン
    ========================= */

    #photoButton {

      position: fixed;

      bottom:
        max(
          20px,
          env(safe-area-inset-bottom)
        );

      left: 50%;

      transform:
        translateX(-50%);

      width: 64px;
      height: 64px;

      border-radius: 50%;

      border:
        5px solid white;

      background:
        rgba(255,255,255,0.35);

      z-index: 9999;
    }

  </style>

</head>


<body>


<!-- =========================
     AR
========================= -->

<a-scene

  id="arScene"

  mindar-image="
    imageTargetSrc: ./assets/ume-marker.mind;
    filterMinCF: 0.001;
    filterBeta: 0.01;
    warmupTolerance: 5;
    missTolerance: 20;
  "

  embedded

  color-space="sRGB"

  renderer="
    colorManagement: true;
    physicallyCorrectLights: true;
    preserveDrawingBuffer: true;
  "

  vr-mode-ui="enabled: false"

  device-orientation-permission-ui="
    enabled: false
  ">


  <!-- =========================
       モデル
  ========================= -->

  <a-assets>


    <a-asset-item
      id="umekoModel"
      src="./assets/umeko.glb">
    </a-asset-item>


    <a-asset-item
      id="zundamonModel"
      src="./assets/zundamon.glb">
    </a-asset-item>


  </a-assets>



  <!-- =========================
       マーカー
  ========================= -->

  <a-entity

    id="markerTarget"

    mindar-image-target="
      targetIndex: 0
    ">


    <!-- =====================
         津田梅子

         ★ここだけ変更
         rotation -90 0 0
    ====================== -->

<a-gltf-model
  id="umeko"
  src="#umekoModel"
  position="0 0 0"
  rotation="90 0 0"
  scale="1.0 1.0 1.0"
  visible="true">
</a-gltf-model>



    <!-- =====================
         ずんだもん
         動作版の設定を維持
    ====================== -->

<a-gltf-model
  id="zundamon"
  src="#zundamonModel"
  position="0.3 0 0"
  rotation="90 0 0"
  scale="1.2 1.2 1.2"
  visible="false"
  animation="
    property: scale;
    from: 1.2 1.2 1.2;
    to: 1.2 1.28 1.2;
    dur: 600;
    dir: alternate;
    loop: true;
    easing: easeInOutQuad;
  ">
</a-gltf-model>


  </a-entity>



  <!-- =========================
       カメラ
  ========================= -->

  <a-camera

    position="0 0 0"

    look-controls="
      enabled: false
    ">

  </a-camera>


</a-scene>



<!-- =========================
     背景
========================= -->

<div id="backgroundEffect"></div>



<!-- =========================
     操作パネル
========================= -->

<div id="controls">


  <!-- キャラクター -->

  <div class="controlRow">


    <div class="controlLabel">
      キャラ
    </div>


    <div class="buttonGroup">


      <button

        id="umekoButton"

        class="
          selectButton
          active
        ">

        津田梅子

      </button>


      <button

        id="zundamonButton"

        class="selectButton">

        ずんだもん

      </button>


    </div>

  </div>



  <!-- 背景 -->

  <div class="controlRow">


    <div class="controlLabel">
      背景
    </div>


    <div class="buttonGroup">


      <button

        id="normalButton"

        class="
          selectButton
          active
        ">

        通常

      </button>


      <button

        id="airportButton"

        class="selectButton">

        空港

      </button>


      <button

        id="universityButton"

        class="selectButton">

        大学

      </button>


    </div>

  </div>


</div>



<!-- =========================
     撮影ボタン
========================= -->

<button

  id="photoButton"

  aria-label="写真を撮る">

</button>



<script>


/* ========================================
   キャラクター切替
======================================== */


const umeko =
  document.querySelector("#umeko");


const zundamon =
  document.querySelector("#zundamon");


const umekoButton =
  document.querySelector("#umekoButton");


const zundamonButton =
  document.querySelector("#zundamonButton");



function selectCharacter(name) {


  const showUmeko =
    name === "umeko";


  umeko.setAttribute(
    "visible",
    showUmeko
  );


  zundamon.setAttribute(
    "visible",
    !showUmeko
  );


  umekoButton.classList.toggle(
    "active",
    showUmeko
  );


  zundamonButton.classList.toggle(
    "active",
    !showUmeko
  );

}



umekoButton.addEventListener(
  "click",
  () => {

    selectCharacter("umeko");

  }
);



zundamonButton.addEventListener(
  "click",
  () => {

    selectCharacter("zundamon");

  }
);



/* ========================================
   背景
======================================== */


const backgroundEffect =
  document.querySelector(
    "#backgroundEffect"
  );


const normalButton =
  document.querySelector(
    "#normalButton"
  );


const airportButton =
  document.querySelector(
    "#airportButton"
  );


const universityButton =
  document.querySelector(
    "#universityButton"
  );


let currentBackground =
  "normal";



function selectBackground(type) {


  currentBackground =
    type;


  normalButton.classList.remove(
    "active"
  );


  airportButton.classList.remove(
    "active"
  );


  universityButton.classList.remove(
    "active"
  );



  if (type === "normal") {


    normalButton.classList.add(
      "active"
    );


    backgroundEffect.style.display =
      "none";


    backgroundEffect.style.backgroundImage =
      "none";

  }



  if (type === "airport") {


    airportButton.classList.add(
      "active"
    );


    backgroundEffect.style.backgroundImage =
      "url('./assets/airport.jpg')";


    backgroundEffect.style.display =
      "block";

  }



  if (type === "university") {


    universityButton.classList.add(
      "active"
    );


    backgroundEffect.style.backgroundImage =
      "url('./assets/university.jpg')";


    backgroundEffect.style.display =
      "block";

  }

}



normalButton.addEventListener(
  "click",
  () => {

    selectBackground(
      "normal"
    );

  }
);



airportButton.addEventListener(
  "click",
  () => {

    selectBackground(
      "airport"
    );

  }
);



universityButton.addEventListener(
  "click",
  () => {

    selectBackground(
      "university"
    );

  }
);



/* ========================================
   写真撮影
======================================== */


document
  .getElementById("photoButton")
  .addEventListener(
    "click",
    () => {


      const video =
        document.querySelector(
          "video"
        );


      const scene =
        document.querySelector(
          "a-scene"
        );



      if (
        !video ||
        !scene ||
        !scene.renderer
      ) {


        alert(
          "ARカメラの準備ができていません"
        );


        return;

      }



      /*
        撮影直前にARを再描画
      */

      scene.renderer.render(
        scene.object3D,
        scene.camera
      );



      requestAnimationFrame(
        () => {


          const arCanvas =
            scene.canvas;


          const canvas =
            document.createElement(
              "canvas"
            );


          canvas.width =
            video.videoWidth;


          canvas.height =
            video.videoHeight;


          const ctx =
            canvas.getContext(
              "2d"
            );



          /* =====================
             カメラ映像
          ===================== */

          ctx.drawImage(

            video,

            0,
            0,

            canvas.width,
            canvas.height

          );



          /* =====================
             ARモデル
          ===================== */

          ctx.drawImage(

            arCanvas,

            0,
            0,

            canvas.width,
            canvas.height

          );



          /* =====================
             背景
          ===================== */

          if (
            currentBackground !==
            "normal"
          ) {


            const bg =
              new Image();


            bg.onload =
              () => {


                ctx.save();


                ctx.globalAlpha =
                  0.30;


                ctx.drawImage(

                  bg,

                  0,
                  0,

                  canvas.width,
                  canvas.height

                );


                ctx.restore();


                addPhotoFrame(
                  canvas,
                  ctx
                );

              };


            if (
              currentBackground ===
              "airport"
            ) {

              bg.src =
                "./assets/airport.jpg";

            }


            if (
              currentBackground ===
              "university"
            ) {

              bg.src =
                "./assets/university.jpg";

            }


          } else {


            addPhotoFrame(
              canvas,
              ctx
            );

          }


        }
      );

    }
  );



/* ========================================
   写真フレーム
======================================== */


function addPhotoFrame(
  canvas,
  ctx
) {


  const bandHeight =
    canvas.height * 0.10;



  ctx.fillStyle =
    "rgba(0,0,0,0.55)";


  ctx.fillRect(

    0,

    canvas.height -
      bandHeight,

    canvas.width,

    bandHeight

  );



  ctx.fillStyle =
    "white";


  ctx.textAlign =
    "center";


  ctx.textBaseline =
    "middle";


  ctx.font =
    `bold ${Math.floor(
      canvas.width * 0.045
    )}px sans-serif`;


  ctx.fillText(

    "津田 AR Photo",

    canvas.width / 2,

    canvas.height -
      bandHeight / 2

  );


  savePhoto(
    canvas
  );

}



/* ========================================
   写真保存
======================================== */


function savePhoto(
  canvas
) {


  canvas.toBlob(

    async blob => {


      if (!blob) {

        alert(
          "写真を作成できませんでした"
        );

        return;

      }



      const file =
        new File(

          [blob],

          "tsuda-ar-photo.png",

          {
            type:
              "image/png"
          }

        );



      /*
        iPhone / Android
      */

      if (
        navigator.share &&
        navigator.canShare &&
        navigator.canShare({
          files: [file]
        })
      ) {


        try {


          await navigator.share({

            files: [file],

            title:
              "津田 AR Photo"

          });


          return;


        } catch (error) {


          if (
            error.name ===
            "AbortError"
          ) {

            return;

          }


          console.error(
            error
          );

        }

      }



      /*
        Share APIが使えない場合
      */

      const url =
        URL.createObjectURL(
          blob
        );


      const link =
        document.createElement(
          "a"
        );


      link.href =
        url;


      link.download =
        "tsuda-ar-photo.png";


      document.body.appendChild(
        link
      );


      link.click();


      link.remove();


      setTimeout(
        () => {

          URL.revokeObjectURL(
            url
          );

        },

        1000
      );

    },

    "image/png",

    1

  );

}



/* ========================================
   初期状態
======================================== */


selectCharacter(
  "umeko"
);


selectBackground(
  "normal"
);


</script>


</body>

</html>
