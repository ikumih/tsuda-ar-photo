<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width, initial-scale=1.0,
 maximum-scale=1.0, user-scalable=no">

<title>AR Photo</title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  font-family: sans-serif;
}

/* AR表示領域 */
#ar-container {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: transparent;
}

/* MindARのカメラ映像 */
#ar-container video {
  position: absolute !important;
  z-index: 0 !important;
  background: transparent !important;
}

/* 3D描画はカメラの前面 */
#ar-container canvas {
  position: absolute !important;
  z-index: 1 !important;
  background: transparent !important;
}

/* A-Frameの背景を透明に */
a-scene,
.a-canvas {
  background: transparent !important;
}

/* 案内 */
#guide {
  position: fixed;
  z-index: 20;
  top: 15px;
  left: 50%;
  transform: translateX(-50%);
  width: max-content;
  max-width: 92%;
  padding: 10px 16px;
  border-radius: 24px;
  background: rgba(255,255,255,.92);
  color: #333;
  text-align: center;
  font-size: 13px;
  pointer-events: none;
}

/* 操作パネル */
#controls {
  position: fixed;
  z-index: 30;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  width: 94%;
  max-width: 500px;
  padding: 12px;
  border-radius: 18px;
  background: rgba(255,255,255,.93);
}

.buttons {
  display: flex;
  gap: 6px;
  margin-bottom: 10px;
}

button {
  flex: 1;
  padding: 12px 6px;
  border: 1px solid #ccc;
  border-radius: 12px;
  background: white;
  color: #333;
  font-size: 14px;
  cursor: pointer;
}

button.active {
  background: #dceff5;
  border: 2px solid #58a6bc;
  font-weight: bold;
}

#capture {
  width: 100%;
  padding: 13px;
  background: #333;
  color: white;
  font-size: 16px;
}

#status {
  margin-top: 8px;
  font-size: 11px;
  color: #555;
  text-align: center;
}

/* 撮影後のプレビュー */
#preview {
  display: none;
  position: fixed;
  z-index: 100;
  inset: 0;
  background: rgba(0,0,0,.95);
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 15px;
}

#photo {
  max-width: 100%;
  max-height: 72vh;
  object-fit: contain;
}

.previewButtons {
  display: flex;
  width: 100%;
  max-width: 400px;
  gap: 10px;
}
</style>

<script>
/* 恐竜をゆっくり揺らす */
AFRAME.registerComponent("dino-sway", {
  tick: function(time) {
    const t = time / 1000;
    this.el.object3D.rotation.y =
      Math.sin(t * 1.3) * 0.08;
  }
});
</script>
</head>

<body>

<div id="ar-container">

<a-scene
  id="scene"
  mindar-image="
    imageTargetSrc: ./assets/ume-marker.mind;
    autoStart: true;
    uiLoading: yes;
    uiScanning: no;
  "
  embedded
  renderer="
    colorManagement: true;
    physicallyCorrectLights: true;
    preserveDrawingBuffer: true;
    alpha: true;
  "
  background="color: #000000; transparent: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity
    id="target"
    mindar-image-target="targetIndex: 0">

    <!-- 津田梅子 -->
    <a-gltf-model
      id="model-umeko"
      position="0 0 0"
      rotation="90 0 0"
      scale="1.5 1.5 1.5"
      visible="false">
    </a-gltf-model>

    <!-- ずんだもん -->
    <a-gltf-model
      id="model-zundamon"
      position="0 0 0"
      rotation="90 0 0"
      scale="1.5 1.5 1.5"
      visible="false">
    </a-gltf-model>

    <!-- 恐竜 -->
    <a-entity
      position="0 0 0"
      rotation="0 0 0">

      <a-gltf-model
        id="model-dino"
        position="0 0 0"
        rotation="0 0 0"
        scale="1 1 1"
        visible="false"
        dino-sway>
      </a-gltf-model>

    </a-entity>

  </a-entity>

</a-scene>
</div>

<div id="guide">
  カメラを準備しています
</div>

<div id="controls">

  <div class="buttons">

    <button id="btn-umeko"
      class="active"
      onclick="selectCharacter('umeko')">
      津田梅子
    </button>

    <button id="btn-zundamon"
      onclick="selectCharacter('zundamon')">
      ずんだもん
    </button>

    <button id="btn-dino"
      onclick="selectCharacter('dino')">
      恐竜
    </button>

  </div>

  <button id="capture" onclick="takePhoto()">
    写真を撮る
  </button>

  <div id="status">
    ARを起動しています
  </div>

</div>

<div id="preview">

  <img id="photo" alt="AR写真">

  <div class="previewButtons">

    <button onclick="savePhoto()">
      保存・共有
    </button>

    <button onclick="closePreview()">
      ARに戻る
    </button>

  </div>

</div>

<script>
const scene = document.getElementById("scene");
const target = document.getElementById("target");
const guide = document.getElementById("guide");
const statusText = document.getElementById("status");

const characters = {
  umeko: {
    name: "津田梅子",
    file: "./assets/umeko.glb"
  },
  zundamon: {
    name: "ずんだもん",
    file: "./assets/zundamon.glb"
  },
  dino: {
    name: "恐竜",
    file: "./assets/T_Rex.glb"
  }
};

let currentCharacter = "umeko";
let markerFound = false;
let photoBlob = null;
let photoURL = null;

const loaded = {};

/* 必要なモデルだけ読み込む */
function loadCharacter(id) {

  if (loaded[id]) return;

  loaded[id] = true;

  const model =
    document.getElementById("model-" + id);

  model.addEventListener("model-loaded", () => {
    statusText.textContent =
      characters[id].name + "を読み込みました";
  });

  model.addEventListener("model-error", () => {
    loaded[id] = false;
    statusText.textContent =
      characters[id].name + "の読み込みに失敗しました";
  });

  model.setAttribute(
    "gltf-model",
    characters[id].file
  );
}

/* キャラクター選択 */
function selectCharacter(id) {

  currentCharacter = id;

  Object.keys(characters).forEach(key => {

    const model =
      document.getElementById("model-" + key);

    const button =
      document.getElementById("btn-" + key);

    model.setAttribute(
      "visible",
      key === id
    );

    button.classList.toggle(
      "active",
      key === id
    );

  });

  loadCharacter(id);

  statusText.textContent =
    characters[id].name + "を選択しました";
}

/* マーカー認識 */
target.addEventListener("targetFound", () => {

  markerFound = true;

  guide.textContent =
    "マーカーを認識しました";

  statusText.textContent =
    characters[currentCharacter].name + "を表示中";

});

target.addEventListener("targetLost", () => {

  markerFound = false;

  guide.textContent =
    "梅マークにカメラを向けてください";

  statusText.textContent =
    "マーカーを探しています";

});

/* AR起動 */
scene.addEventListener("arReady", () => {

  guide.textContent =
    "梅マークにカメラを向けてください";

  statusText.textContent =
    "ARの準備ができました";

  fixCameraLayers();

});

scene.addEventListener("arError", () => {

  statusText.textContent =
    "AR起動エラー：カメラの許可を確認してください";

});

/* カメラ映像と3D描画の重なり順を修正 */
function fixCameraLayers() {

  const container =
    document.getElementById("ar-container");

  const video =
    document.querySelector(
      "video.mindar-ui-video, #ar-container video"
    );

  const canvas =
    scene.renderer?.domElement;

  if (video) {
    video.style.zIndex = "0";
    video.style.background = "transparent";
  }

  if (canvas) {
    canvas.style.zIndex = "1";
    canvas.style.background = "transparent";
  }

  if (scene.renderer) {
    scene.renderer.setClearColor(0x000000, 0);
    scene.renderer.setClearAlpha(0);
  }

}

/* 写真撮影 */
async function takePhoto() {

  const captureButton =
    document.getElementById("capture");

  captureButton.disabled = true;

  try {

    const arSystem =
      scene.systems["mindar-image-system"];

    const video =
      arSystem && arSystem.video;

    const renderer =
      scene.renderer;

    if (!video || !renderer ||
        video.readyState < 2) {
      throw new Error(
        "カメラが準備できていません"
      );
    }

    if (!markerFound) {
      throw new Error(
        "梅マーカーを認識してください"
      );
    }

    const width = video.videoWidth;
    const height = video.videoHeight;

    const canvas =
      document.createElement("canvas");

    canvas.width = width;
    canvas.height = height;

    const ctx =
      canvas.getContext("2d");

    /* カメラ画像 */
    ctx.drawImage(
      video,
      0, 0,
      width, height
    );

    /* 3D画像 */
    renderer.render(
      scene.object3D,
      scene.camera
    );

    const arCanvas =
      renderer.domElement;

    const videoAspect = width / height;
    const arAspect =
      arCanvas.width / arCanvas.height;

    let drawWidth;
    let drawHeight;
    let offsetX;
    let offsetY;

    if (arAspect > videoAspect) {

      drawWidth = width;
      drawHeight = width / arAspect;
      offsetX = 0;
      offsetY = (height - drawHeight) / 2;

    } else {

      drawHeight = height;
      drawWidth = height * arAspect;
      offsetX = (width - drawWidth) / 2;
      offsetY = 0;

    }

    ctx.drawImage(
      arCanvas,
      offsetX,
      offsetY,
      drawWidth,
      drawHeight
    );

    photoBlob = await new Promise(
      (resolve, reject) => {

        canvas.toBlob(blob => {

          if (blob) resolve(blob);
          else reject(
            new Error("写真を作成できません")
          );

        }, "image/png");

      }
    );

    if (photoURL) {
      URL.revokeObjectURL(photoURL);
    }

    photoURL =
      URL.createObjectURL(photoBlob);

    document.getElementById("photo").src =
      photoURL;

    document.getElementById("preview")
      .style.display = "flex";

  } catch (error) {

    statusText.textContent =
      "撮影エラー：" + error.message;

  } finally {

    captureButton.disabled = false;

  }

}

/* 保存・共有 */
async function savePhoto() {

  if (!photoBlob) return;

  const file = new File(
    [photoBlob],
    "AR_Photo.png",
    { type: "image/png" }
  );

  try {

    if (
      navigator.canShare &&
      navigator.canShare({ files: [file] }) &&
      navigator.share
    ) {

      await navigator.share({
        files: [file],
        title: "AR Photo"
      });

    } else {

      const link =
        document.createElement("a");

      link.href = photoURL;
      link.download = "AR_Photo.png";

      document.body.appendChild(link);
      link.click();
      link.remove();

    }

    closePreview();

  } catch (error) {

    if (error.name !== "AbortError") {
      statusText.textContent =
        "保存・共有に失敗しました";
    }

  }

}

/* AR画面に戻る */
function closePreview() {

  document.getElementById("preview")
    .style.display = "none";

  guide.textContent = markerFound
    ? "マーカーを認識しました"
    : "梅マークにカメラを向けてください";

}

/* 起動後にモデル読み込み */
scene.addEventListener("loaded", () => {
  selectCharacter("umeko");
});

</script>

</body>
</html>
