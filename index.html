<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no">

  <title>津田 AR Photo</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    a-scene {
      position: fixed !important;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
      renderer="colorManagement: true; physicallyCorrectLights: true; preserveDrawingBuffer: true"
    }
    #photoButton {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  width: 72px;
  height: 72px;
  border-radius: 50%;
  border: 5px solid white;
  background: rgba(255,255,255,0.35);
  z-index: 9999;
}
  </style>
</head>

<body>

<a-scene
  mindar-image="imageTargetSrc: ./assets/ume-marker.mind;
                filterMinCF: 0.001;
                filterBeta: 0.01;
                warmupTolerance: 5;
                missTolerance: 20;"
  embedded
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <a-asset-item
      id="zundamon"
      src="./assets/zundamon.glb">
    </a-asset-item>
  </a-assets>

  <a-entity mindar-image-target="targetIndex: 0">

<a-gltf-model
  src="#zundamon"
  position="1.１ 0 0"
  rotation="90 0 0"
  scale="2.3 2.3 2.3"
  animation="property: scale; from: 2.3 2.3 2.3; to: 2.3 2.45 2.3; dur: 600; dir: alternate; loop: true; easing: easeInOutQuad">
</a-gltf-model>

  </a-entity>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

</a-scene>
<button id="photoButton" aria-label="写真を撮る"></button>
  
<script>
document.getElementById("photoButton").addEventListener("click", () => {

  const video = document.querySelector("video");
  const scene = document.querySelector("a-scene");

  if (!video || !scene || !scene.renderer) {
    alert("ARカメラの準備ができていません");
    return;
  }

  // 撮影直前にARを再描画
  scene.renderer.render(scene.object3D, scene.camera);

  requestAnimationFrame(() => {

    const arCanvas = scene.canvas;

    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const ctx = canvas.getContext("2d");

    // カメラ映像
    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );

    // AR表示（ずんだもん）
    ctx.drawImage(
      arCanvas,
      0,
      0,
      canvas.width,
      canvas.height
    );

// ===== 写真用フレーム =====

// 下部に半透明の帯
const bandHeight = canvas.height * 0.10;

ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
ctx.fillRect(
  0,
  canvas.height - bandHeight,
  canvas.width,
  bandHeight
);

// メインタイトル
ctx.fillStyle = "white";
ctx.textAlign = "center";
ctx.textBaseline = "middle";

ctx.font = `bold ${Math.round(canvas.width * 0.050)}px sans-serif`;

ctx.fillText(
  "津田塾大学",
  canvas.width / 2,
  canvas.height - bandHeight * 0.62
);

// サブタイトル
ctx.font = `${Math.round(canvas.width * 0.027)}px sans-serif`;

ctx.fillText(
  "AR PHOTO",
  canvas.width / 2,
  canvas.height - bandHeight * 0.25
);
    
    canvas.toBlob((blob) => {

      const imageUrl = URL.createObjectURL(blob);

      const preview = window.open("", "_blank");

      preview.document.write(`
        <!DOCTYPE html>
        <html lang="ja">

        <head>
          <meta charset="UTF-8">
          <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

          <title>AR Photo</title>

          <style>
            * {
              box-sizing: border-box;
            }

            html, body {
              margin: 0;
              padding: 0;
              background: #111;
              color: white;
              font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Helvetica Neue",
                sans-serif;
            }

            .container {
              min-height: 100vh;
              display: flex;
              flex-direction: column;
              align-items: center;
            }

            .photo {
              width: 100%;
              display: block;
            }

            .buttons {
              width: 100%;
              padding: 18px;
              display: flex;
              gap: 12px;
            }

            button {
              flex: 1;
              min-height: 56px;
              border-radius: 14px;
              border: none;
              font-size: 17px;
              font-weight: 600;
            }

            .save {
              background: white;
              color: #111;
            }

            .retry {
              background: #444;
              color: white;
            }

            .note {
              padding: 0 20px 20px;
              font-size: 13px;
              color: #bbb;
              text-align: center;
            }
          </style>
        </head>

        <body>

          <div class="container">

            <img
              class="photo"
              src="${imageUrl}"
              alt="撮影したAR写真">

            <div class="buttons">

              <button
                class="retry"
                onclick="window.close()">
                撮り直す
              </button>

              <button
                class="save"
                id="saveButton">
                写真に保存
              </button>

            </div>

            <div class="note">
              「写真に保存」を押して、共有画面から「画像を保存」を選んでください。
            </div>

          </div>

          <script>

            document
              .getElementById("saveButton")
              .addEventListener("click", async () => {

                try {

                  const response =
                    await fetch("${imageUrl}");

                  const blob =
                    await response.blob();

                  const file =
                    new File(
                      [blob],
                      "tsuda-ar-photo.png",
                      { type: "image/png" }
                    );

                  if (
                    navigator.share &&
                    navigator.canShare &&
                    navigator.canShare({
                      files: [file]
                    })
                  ) {

await navigator.share({
  files: [file],
  title: "AR Photo"
});

window.close();

                  } else {

                    alert(
                      "写真を長押しして「写真に保存」を選んでください。"
                    );

                  }

                } catch (error) {

                  console.error(error);

                  alert(
                    "写真を長押しして「写真に保存」を選んでください。"
                  );

                }

              });

          <\/script>

        </body>
        </html>
      `);

      preview.document.close();

    }, "image/png");

  });

});
</script>
  
</body>
</html>
